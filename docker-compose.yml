# =============================================================================
#  Déploiement sur le VPS (Traefik + HTTPS automatique)
#  Les secrets (ADMIN_EMAIL, ADMIN_PASSWORD_HASH) sont dans .env, jamais commité.
#  Pas de `ports:` : Traefik route le trafic via le réseau `proxy`.
# =============================================================================
name: petite-sirene

services:
  web:
    build: .
    image: petite-sirene:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.petite-sirene.rule: Host(`${SITE_HOST:-petite-sirene.paulpenot.fr}`)
      traefik.http.routers.petite-sirene.middlewares: compress@file,rate-limit@file
      traefik.http.services.petite-sirene.loadbalancer.server.port: "3000"
      mc.name: "La petite sirène"
      mc.description: "Pronostics de naissance sur le thème de l'océan"
      mc.icon: "🐚"
      mc.repo: "https://github.com/penotdev-code/pronostic-ocean"

networks:
  proxy:
    external: true

volumes:
  data:
